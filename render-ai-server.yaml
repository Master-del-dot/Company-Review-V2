services:
  - type: web
    name: company-review-ai-server
    runtime: node
    plan: free
    rootDir: ai-server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: OLLAMA_MODEL
        value: llama3.2:1b
